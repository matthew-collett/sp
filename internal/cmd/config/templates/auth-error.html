<!DOCTYPE html>
<html lang="en">
<head>
  <title>sp - Authentication Failed</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a1a;
      padding: 1rem;
    }

    .container {
      text-align: center;
      background: #1e1e1e;
      padding: 3rem 2rem;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      background: #e05252;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
    }

    .brand {
      font-size: 0.75rem;
      font-weight: 600;
      color: #888;
      margin-bottom: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      color: #e0e0e0;
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
      font-weight: 600;
    }

    p {
      color: #999;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 480px) {
      .container {
        padding: 2.5rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">SP</div>
    <div class="icon">✘</div>
    <h1>Authentication Cancelled</h1>
    <p>You may now close this window and return to your terminal</p>
  </div>
</body>
</html>
